name: Update bilingual CV and publish homepage
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Yihan_Gao_CV_GitHub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/build_cv.py --site-dir _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Yihan_Gao_CV_GitHub/_site
      - uses: actions/upload-artifact@v4
        with:
          name: Yihan-Gao-bilingual-CV
          path: Yihan_Gao_CV_GitHub/cv/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Publish homepage
        id: deployment
        uses: actions/deploy-pages@v4
